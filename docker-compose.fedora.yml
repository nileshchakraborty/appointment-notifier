name: appointment-notifier-fedora

services:
  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "72"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka-init:
    image: apache/kafka:4.2.2
    depends_on:
      kafka:
        condition: service_healthy
    command: ["/bin/bash", "-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic appointment-telegram-alerts --partitions 6 --replication-factor 1"]
    restart: "no"

  appointment-notifier:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/appointment-notifier-fedora:20261022
    container_name: appointment-notifier
    init: true
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      IMESSAGE_ENABLED: "false"
      TALOS_SCOUT_ENABLED: "false"
      TELEGRAM_HISTORY_LIMIT: "100"
      TELEGRAM_QUEUE_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - /home/nilesh/appointment-notifier/.state:/app/.state:z
      - /home/nilesh/appointment-notifier/.secrets:/run/secrets:ro,Z
      - /home/nilesh/appointment-notifier/media:/mnt/drive2/appointment-notifier-media:Z
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    mem_limit: 512m
    cpus: "1.00"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

  telegram-delivery:
    image: local/appointment-notifier-fedora:20261022
    command: ["appointment-notifier", "deliver-telegram"]
    scale: 3
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      IMESSAGE_ENABLED: "false"
      TALOS_SCOUT_ENABLED: "false"
      TELEGRAM_QUEUE_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - /home/nilesh/appointment-notifier/.state:/app/.state:z
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    depends_on:
      appointment-notifier:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kafka_data:
