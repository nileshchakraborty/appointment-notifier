services:
  portainer:
    image: portainer/portainer-ce:2.39.5
    container_name: rpi-portainer
    restart: unless-stopped
    environment:
      AGENT_SECRET: "${PORTAINER_AGENT_SECRET:?PORTAINER_AGENT_SECRET is required}"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer-data:/data

  caddy:
    image: caddy:2-alpine
    container_name: rpi-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/caddy/tls:ro
      - ./dashboard:/srv/dashboard:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
