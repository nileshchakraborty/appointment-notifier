name: ollama-fedora

services:
  ollama:
    image: ollama/ollama:0.19.0
    container_name: ollama
    restart: unless-stopped
    ports:
      - "192.168.1.250:11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "4"
    volumes:
      - /home/nilesh/ollama-data:/root/.ollama:Z
    mem_limit: 4g
    cpus: "4.00"
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
