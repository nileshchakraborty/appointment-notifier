# Preserve the Pi's former Ollama LAN API address while Fedora runs the model.
server {
    listen 192.168.1.229:11434;
    server_name 192.168.1.229 rpi.local;

    location / {
        proxy_pass http://192.168.1.250:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
